# Rebuilds the static site and publishes it to the gh-pages branch on every push to main,
# so editing data/*.json (products, links, roadmap) on GitHub updates the live site.
# It also runs every 6 hours to pull in new releases from GTA5-Mods, the FiveM forum and GitHub.
# After a real change (not the 6-hourly refresh) it tells search engines through IndexNow.
name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Image tools (build-time only; the site itself has no dependencies)
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Build
        env:
          SITE_URL: https://hex-modifications.github.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: add these as repository secrets to list public Patreon posts as releases
          PATREON_ACCESS_TOKEN: ${{ secrets.PATREON_ACCESS_TOKEN }}
          PATREON_CAMPAIGN_ID: ${{ secrets.PATREON_CAMPAIGN_ID }}
        run: node scripts/build-static.mjs
      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Tell search engines (IndexNow)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          node -e '
            const fs = require("fs");
            const net = JSON.parse(fs.readFileSync("data/network.json", "utf8"));
            const key = net.indexnow && net.indexnow.enabled !== false ? net.indexnow.key : "";
            if (!/^[a-f0-9]{32}$/.test(key || "")) { console.log("IndexNow off"); process.exit(0); }
            const urls = [...fs.readFileSync("dist/sitemap.xml", "utf8").matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            const host = new URL(urls[0]).host;
            setTimeout(async () => {
              const r = await fetch("https://api.indexnow.org/indexnow", { method: "POST", headers: { "Content-Type": "application/json; charset=utf-8" },
                body: JSON.stringify({ host, key, keyLocation: `https://${host}/${key}.txt`, urlList: urls }) });
              console.log("IndexNow:", r.status, urls.length, "URLs");
            }, 60000);   // give GitHub Pages a minute to serve the new key file
          '
